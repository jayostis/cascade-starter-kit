name: runtime
description: >
  The runtime a pull request names on a `Depends-On:` line, as Zuul takes a named change: the `package` artifact of
  runtime-js's check at that pull request's head, waited for while that check packs it. Nothing while no open runtime-js
  pull request is named: the pin is the runtime then. With `install`, the checkout is pinned to it as runtime-js's own
  starter action pins it, never pushed.
inputs:
  install:
    description: '"true" to pin the checkout to the tarball and install it.'
    default: "false"
outputs:
  tarball:
    description: The runtime tarball, as an absolute path; empty when the pin is the runtime.
    value: ${{ steps.runtime.outputs.tarball }}

runs:
  using: composite
  steps:
    # The body is read now, not from the event: a re-run after the body gained its Depends-On line sees the line.
    - id: runtime
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        PULL: ${{ github.event.pull_request.number }}
      run: |
        set -euo pipefail
        [ -n "$PULL" ] || exit 0
        body=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PULL}" --jq '.body // ""')
        pair=$(printf '%s\n' "$body" | tr -d '\r' \
          | grep -iEo '^[[:space:]]*Depends-On:[[:space:]]*https://github\.com/jayostis/cascade-runtime-js/pull/[0-9]+' \
          | head -n 1 | grep -Eo '[0-9]+$' || true)
        [ -n "$pair" ] || exit 0
        named="jayostis/cascade-runtime-js#${pair}"
        read -r state merged head < <(gh api "repos/jayostis/cascade-runtime-js/pulls/${pair}" \
          --jq '[.state, (.merged | tostring), .head.sha] | join(" ")')
        if [ "$merged" = true ]; then
          echo "::notice title=runtime::${named}, named on Depends-On, has merged: the pin is the runtime"
          exit 0
        fi
        if [ "$state" != open ]; then
          echo "::error title=runtime::${named}, named on Depends-On, is closed without merging; name another pull request or remove the line"
          exit 1
        fi
        deadline=$((SECONDS + 40 * 60))
        while :; do
          run=$(gh api "repos/jayostis/cascade-runtime-js/actions/runs?head_sha=${head}&event=pull_request&per_page=100" \
            --jq '[.workflow_runs[] | select(.path == ".github/workflows/check.yml")] | sort_by(.id) | last | .id // empty')
          if [ -n "$run" ] && gh api "repos/jayostis/cascade-runtime-js/actions/runs/${run}/artifacts" \
            --jq '.artifacts[] | select(.name == "package" and (.expired | not)) | .id' | grep -q .; then
            break
          fi
          if [ "$SECONDS" -ge "$deadline" ]; then
            echo "::error title=runtime::no check of ${named} at ${head} has packed the runtime; rerun this once it has"
            exit 1
          fi
          sleep 30
        done
        folder="${RUNNER_TEMP}/runtime"
        rm -rf "$folder"
        gh run download "$run" -R jayostis/cascade-runtime-js -n package -D "$folder"
        tarball=$(cd "$folder" && node -p "require('node:path').resolve(process.argv[1]).replaceAll('\\\\', '/')" cascade-runtime-*.tgz)
        echo "::notice title=runtime::the runtime is ${named}'s, packed by its check run ${run} at ${head}"
        echo "The runtime of ${named} at ${head}, from its check run ${run}" >> "$GITHUB_STEP_SUMMARY"
        echo "tarball=${tarball}" >> "$GITHUB_OUTPUT"
    # The lock forgets where the old runtime was, or npm installs the new one under app/ and the root resolves none.
    - if: ${{ inputs.install == 'true' && steps.runtime.outputs.tarball != '' }}
      shell: bash
      env:
        TARBALL: ${{ steps.runtime.outputs.tarball }}
      run: |
        set -euo pipefail
        node --input-type=module -e '
          import { readFileSync, writeFileSync } from "node:fs";
          import { lockWithoutRuntime } from "./scripts/pin-lib.mjs";
          const manifest = JSON.parse(readFileSync("app/package.json", "utf8"));
          manifest.dependencies["cascade-runtime"] = `file:${process.env.TARBALL}`;
          writeFileSync("app/package.json", JSON.stringify(manifest, null, 2) + "\n");
          const lock = JSON.parse(readFileSync("package-lock.json", "utf8"));
          writeFileSync("package-lock.json", JSON.stringify(lockWithoutRuntime(lock), null, 2) + "\n");
        '
        npm install --no-audit --no-fund
        packed=$(basename "$TARBALL" .tgz)
        packed=${packed#cascade-runtime-}
        installed=$(node -p 'require("./node_modules/cascade-runtime/package.json").version')
        if [ "$packed" != "$installed" ]; then
          echo "::error title=runtime::the starter resolved cascade-runtime ${installed}, not the named pull request's ${packed}"
          exit 1
        fi
