name: create

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

concurrency:
  group: create-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # create-cascade-app, packed once, so every system below tests the bytes `release` publishes.
  pack:
    name: pack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build:create
      - uses: actions/upload-artifact@v7
        with:
          name: create
          path: |
            build/create-cascade-app-*.tgz
            build/release-notes.md
          if-no-files-found: error

  # An app made by the command from the tarball, on the template's pinned runtime, and used as a person would.
  create:
    name: create (${{ matrix.os }})
    needs: pack
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      GIT_CONFIG_COUNT: 1
      GIT_CONFIG_KEY_0: core.longpaths
      GIT_CONFIG_VALUE_0: "true"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build
      # The check reads the app's screens in Chromium's headless shell, cached as try.yml caches it, where each system keeps it.
      - id: playwright
        shell: bash
        run: |
          set -euo pipefail
          version=$(node -p "require('playwright/package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          case "$RUNNER_OS" in
            Linux) echo "path=~/.cache/ms-playwright" >> "$GITHUB_OUTPUT" ;;
            Windows) echo "path=~/AppData/Local/ms-playwright" >> "$GITHUB_OUTPUT" ;;
            macOS) echo "path=~/Library/Caches/ms-playwright" >> "$GITHUB_OUTPUT" ;;
          esac
      - id: browsers
        uses: actions/cache/restore@v6
        with:
          path: ${{ steps.playwright.outputs.path }}
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-shell
      - id: install
        # Linux needs the shell's system libraries; on Windows --with-deps adds Media Foundation, which the shell never uses, for three minutes.
        run: npx playwright install ${{ runner.os == 'Linux' && '--with-deps' || '' }} --only-shell chromium
      - uses: actions/cache/save@v6
        if: ${{ steps.install.outcome == 'success' && steps.browsers.outputs.cache-hit != 'true' }}
        with:
          path: ${{ steps.playwright.outputs.path }}
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-shell
      - uses: actions/download-artifact@v7
        with:
          name: create
          path: ${{ runner.temp }}/create
      - name: The starter's check, against the tarball
        working-directory: ${{ runner.temp }}
        run: node "$GITHUB_WORKSPACE/check/starter.mjs" create/create-cascade-app-*.tgz

  # Nothing needs macOS, so a release does not wait for it, and a failure still fails the run.
  other-systems:
    name: create (macos-latest)
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    needs: pack
    runs-on: macos-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build
      # The check reads the app's screens in Chromium's headless shell, cached as try.yml caches it, where each system keeps it.
      - id: playwright
        shell: bash
        run: |
          set -euo pipefail
          version=$(node -p "require('playwright/package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          case "$RUNNER_OS" in
            Linux) echo "path=~/.cache/ms-playwright" >> "$GITHUB_OUTPUT" ;;
            Windows) echo "path=~/AppData/Local/ms-playwright" >> "$GITHUB_OUTPUT" ;;
            macOS) echo "path=~/Library/Caches/ms-playwright" >> "$GITHUB_OUTPUT" ;;
          esac
      - id: browsers
        uses: actions/cache/restore@v6
        with:
          path: ${{ steps.playwright.outputs.path }}
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-shell
      - id: install
        # Linux needs the shell's system libraries; on Windows --with-deps adds Media Foundation, which the shell never uses, for three minutes.
        run: npx playwright install ${{ runner.os == 'Linux' && '--with-deps' || '' }} --only-shell chromium
      - uses: actions/cache/save@v6
        if: ${{ steps.install.outcome == 'success' && steps.browsers.outputs.cache-hit != 'true' }}
        with:
          path: ${{ steps.playwright.outputs.path }}
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-shell
      - uses: actions/download-artifact@v7
        with:
          name: create
          path: ${{ runner.temp }}/create
      - name: The starter's check, against the tarball
        working-directory: ${{ runner.temp }}
        run: node "$GITHUB_WORKSPACE/check/starter.mjs" create/create-cascade-app-*.tgz

  # The tested tarball, as the pre-release build-<commit>, never the latest.
  release:
    name: release
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    needs: create
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: create
          path: create
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="build-$GITHUB_SHA"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::notice::$tag is a release already"
            exit 0
          fi
          gh release create "$tag" create/create-cascade-app-*.tgz \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$tag" \
            --notes-file create/release-notes.md \
            --prerelease \
            --latest=false

  # The command exactly as a person is told to run it, from the release just made.
  create-release:
    name: create-release
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build
      # The check reads the app's screens in Chromium's headless shell, cached as try.yml caches it, where each system keeps it.
      - id: playwright
        shell: bash
        run: |
          set -euo pipefail
          version=$(node -p "require('playwright/package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          case "$RUNNER_OS" in
            Linux) echo "path=~/.cache/ms-playwright" >> "$GITHUB_OUTPUT" ;;
            Windows) echo "path=~/AppData/Local/ms-playwright" >> "$GITHUB_OUTPUT" ;;
            macOS) echo "path=~/Library/Caches/ms-playwright" >> "$GITHUB_OUTPUT" ;;
          esac
      - id: browsers
        uses: actions/cache/restore@v6
        with:
          path: ${{ steps.playwright.outputs.path }}
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-shell
      - id: install
        # Linux needs the shell's system libraries; on Windows --with-deps adds Media Foundation, which the shell never uses, for three minutes.
        run: npx playwright install ${{ runner.os == 'Linux' && '--with-deps' || '' }} --only-shell chromium
      - uses: actions/cache/save@v6
        if: ${{ steps.install.outcome == 'success' && steps.browsers.outputs.cache-hit != 'true' }}
        with:
          path: ${{ steps.playwright.outputs.path }}
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-shell
      - name: The starter's check, against the release
        working-directory: ${{ runner.temp }}
        run: node "$GITHUB_WORKSPACE/check/starter.mjs" --release "$GITHUB_SHA"
