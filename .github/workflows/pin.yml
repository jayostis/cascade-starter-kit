name: pin

# The template's one pin moved onto runtime-js's newest build-<commit> pre-release, by a pull request whose checks test
# it. A pull request opened with GITHUB_TOKEN starts no workflow, so this needs the PIN_TOKEN secret (a token that may
# push and open pull requests here). Without it, the schedule does nothing and a run by hand opens a pull request whose
# checks start only once someone closes and reopens it.
on:
  schedule:
    - cron: "23 6 * * *"
  workflow_dispatch:

concurrency:
  group: pin
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  pin:
    name: pin
    runs-on: ubuntu-latest
    steps:
      - id: token
        env:
          PIN_TOKEN: ${{ secrets.PIN_TOKEN }}
        run: |
          if [ -n "$PIN_TOKEN" ]; then
            echo "go=true" >> "$GITHUB_OUTPUT"
          elif [ "$GITHUB_EVENT_NAME" = "schedule" ]; then
            echo "::notice::No PIN_TOKEN secret: the scheduled pin bump does nothing until it exists. Run this workflow by hand to open the pull request with GITHUB_TOKEN."
            echo "go=false" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::No PIN_TOKEN secret: the pull request is opened with GITHUB_TOKEN, so its checks do not start. Close and reopen it to start them."
            echo "go=true" >> "$GITHUB_OUTPUT"
          fi
      - if: ${{ steps.token.outputs.go == 'true' }}
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.PIN_TOKEN || github.token }}
      - if: ${{ steps.token.outputs.go == 'true' }}
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
      - id: newest
        if: ${{ steps.token.outputs.go == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(gh release list --repo jayostis/cascade-runtime-js --limit 100 --json tagName,createdAt \
            --jq '[.[] | select(.tagName | startswith("build-"))] | sort_by(.createdAt) | last | .tagName')
          commit="${tag#build-}"
          echo "runtime-js's newest build is $tag"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          if grep -q "build-$commit/" app/package.json; then
            echo "::notice::The pin is $tag already."
          elif gh pr list --repo "$GITHUB_REPOSITORY" --head "pin/runtime-$commit" --state open --json number --jq 'length' | grep -qx 0; then
            echo "move=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::A pull request for $tag is open already."
          fi
      - if: ${{ steps.newest.outputs.move == 'true' }}
        run: node scripts/pin.mjs "${{ steps.newest.outputs.commit }}"
      - if: ${{ steps.newest.outputs.move == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.PIN_TOKEN || github.token }}
          COMMIT: ${{ steps.newest.outputs.commit }}
        run: |
          branch="pin/runtime-$COMMIT"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add app/package.json package-lock.json
          git commit -m "build(app): pin cascade-runtime to build-$COMMIT"
          git push --force origin "$branch"
          gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "$branch" \
            --title "build(app): pin cascade-runtime to build-${COMMIT:0:7}" \
            --body "Moves the template's pin onto runtime-js's newest pre-release, [build-$COMMIT](https://github.com/jayostis/cascade-runtime-js/releases/tag/build-$COMMIT), by \`node scripts/pin.mjs $COMMIT\`. This pull request's checks test the starter on it."
